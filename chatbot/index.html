<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor Bakery – AI Chat Assistant Demo</title>
<meta name="description" content="Demo project: a bilingual English/Arabic website chat assistant for a fictional bakery in Sharjah, UAE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#b4532a; --brand-dark:#8a3a19; --cream:#fff7ee; --ink:#2b1d14; --muted:#7a6656;
  --bot:#ffffff; --user:#b4532a; --line:#f0e1d2; --shadow:0 18px 50px rgba(60,30,10,.18);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Poppins",system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6}
html[lang="ar"] body{font-family:"Tajawal",system-ui,sans-serif}
.demo-bar{background:#2b1d14;color:#fff;text-align:center;font-size:13px;padding:8px 16px}
.demo-bar b{color:#ffcf9e}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 6vw;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;color:var(--brand)}
.logo span{color:var(--ink)}
.lang-btn{border:1.5px solid var(--brand);background:none;color:var(--brand);padding:7px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.lang-btn:hover{background:var(--brand);color:#fff}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:40px 6vw 70px}
.hero h1{font-size:clamp(30px,4.4vw,50px);line-height:1.15;margin:0 0 14px}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{color:var(--muted);font-size:17px;max-width:520px}
.cta{display:inline-block;margin-top:18px;background:var(--brand);color:#fff;padding:13px 26px;border-radius:12px;font-weight:600;border:0;font:inherit;cursor:pointer}
.cta:hover{background:var(--brand-dark)}
.hero-card{background:linear-gradient(145deg,#f6d2b0,#e9a46f);border-radius:28px;min-height:320px;display:flex;align-items:center;justify-content:center;font-size:120px;box-shadow:var(--shadow)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:0 6vw 80px}
.feature{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
.feature h3{margin:6px 0;font-size:17px}
.feature p{margin:0;color:var(--muted);font-size:14.5px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 16px 100px;border-top:1px solid var(--line)}

/* chat widget */
.chat-toggle{position:fixed;bottom:22px;inset-inline-end:22px;width:62px;height:62px;border-radius:50%;background:var(--brand);color:#fff;border:0;box-shadow:var(--shadow);cursor:pointer;font-size:28px;z-index:20}
.chat-toggle .dot{position:absolute;top:6px;inset-inline-end:6px;width:14px;height:14px;background:#2ecc71;border:2px solid #fff;border-radius:50%}
.chat{position:fixed;bottom:96px;inset-inline-end:22px;width:370px;max-width:calc(100vw - 32px);height:560px;max-height:calc(100vh - 120px);background:#fdfaf6;border-radius:22px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden;z-index:21;border:1px solid var(--line)}
.chat.open{display:flex}
.chat-head{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#fff3;display:flex;align-items:center;justify-content:center;font-size:22px}
.chat-head b{display:block;font-size:15px}
.chat-head small{opacity:.85;font-size:12px}
.chat-head .x{margin-inline-start:auto;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;font-size:14.5px;white-space:pre-line;animation:pop .2s ease}
.bot{background:var(--bot);border:1px solid var(--line);align-self:flex-start;border-end-start-radius:4px}
.user{background:var(--user);color:#fff;align-self:flex-end;border-end-end-radius:4px}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;background:#c9b3a0;border-radius:50%;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none}30%{transform:translateY(-5px)}}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.quick button{background:#fff;border:1px solid var(--brand);color:var(--brand);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.quick button:hover{background:var(--brand);color:#fff}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
.chat input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:14.5px;outline:none}
.chat input:focus{border-color:var(--brand)}
.chat form button{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
.powered{font-size:11px;color:var(--muted);text-align:center;padding:0 0 8px;background:#fff}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:20px}
  .hero-card{min-height:200px;font-size:90px}
  .features{grid-template-columns:1fr}
}
@media (max-width:480px){
  .chat{inset-inline-end:8px;bottom:88px;height:calc(100vh - 110px)}
}
</style>
</head>
<body>
<div class="demo-bar" data-i18n="demo"></div>
<header>
  <div class="logo" data-i18n-html="logo"></div>
  <button class="lang-btn" id="langBtn" type="button">العربية</button>
</header>

<section class="hero">
  <div>
    <h1 data-i18n-html="heroTitle"></h1>
    <p data-i18n="heroText"></p>
    <button class="cta" type="button" id="heroChat" data-i18n="heroCta"></button>
  </div>
  <div class="hero-card" aria-hidden="true">🥐</div>
</section>

<section class="features">
  <div class="feature"><div>🌐</div><h3 data-i18n="f1t"></h3><p data-i18n="f1p"></p></div>
  <div class="feature"><div>⚡</div><h3 data-i18n="f2t"></h3><p data-i18n="f2p"></p></div>
  <div class="feature"><div>📱</div><h3 data-i18n="f3t"></h3><p data-i18n="f3p"></p></div>
</section>

<footer data-i18n="footer"></footer>

<button class="chat-toggle" id="toggle" aria-label="Open chat">💬<span class="dot"></span></button>
<div class="chat" id="chat" role="dialog" aria-label="Chat">
  <div class="chat-head">
    <div class="avatar">🤖</div>
    <div><b data-i18n="botName"></b><small data-i18n="online"></small></div>
    <button class="x" id="close" aria-label="Close">×</button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form id="form" autocomplete="off">
    <input id="input" data-i18n-ph="placeholder">
    <button type="submit" data-i18n="send"></button>
  </form>
  <div class="powered" data-i18n="powered"></div>
</div>

<script>
const T = {
  en: {
    demo: "Demo project by Oyeranmi O. – Noor Bakery is a fictional business. All prices and details are examples.",
    logo: "Noor <span>Bakery</span>", heroTitle: "Fresh bread, cakes & <em>instant answers</em> – day and night",
    heroText: "Meet Noor's chat assistant. It answers customer questions in English and Arabic, takes cake orders and shares opening hours – without waiting for staff.",
    heroCta: "Try the chat assistant", f1t: "English & Arabic", f1p: "Detects the customer's language and switches the whole chat, including right-to-left layout.",
    f2t: "Answers in seconds", f2p: "Opening hours, menu, prices, delivery areas and custom cake orders – handled automatically.",
    f3t: "Hands over to a human", f3p: "When a question needs staff, the assistant collects the details and passes them on.",
    footer: "© Noor Bakery (fictional) · Sharjah, UAE · Demo website built to show a bilingual chat assistant.",
    botName: "Noor Assistant", online: "Online · replies instantly", placeholder: "Type your question…", send: "Send",
    powered: "Demo chatbot · scripted answers, no personal data stored",
    welcome: "Hi! 👋 I'm Noor's assistant. How can I help you today?\nYou can also write in Arabic.",
    quick: ["Opening hours","Menu & prices","Delivery","Order a cake","Location"],
    fallback: "Sorry, I'm not sure about that yet. 🙏 I can help with opening hours, menu, prices, delivery, cake orders and location. Or type \"staff\" to leave a message for our team.",
  },
  ar: {
    demo: "مشروع تجريبي من إعداد أويرانمي أ. – مخبز نور نشاط تجاري وهمي، وجميع الأسعار والتفاصيل أمثلة فقط.",
    logo: "مخبز <span>نور</span>", heroTitle: "خبز طازج وكعك و<em>إجابات فورية</em> – ليلًا ونهارًا",
    heroText: "تعرّف على مساعد الدردشة في مخبز نور. يجيب عن أسئلة العملاء بالعربية والإنجليزية، ويستقبل طلبات الكعك، ويعرض مواعيد العمل – دون انتظار الموظفين.",
    heroCta: "جرّب مساعد الدردشة", f1t: "العربية والإنجليزية", f1p: "يتعرّف على لغة العميل ويحوّل الدردشة بالكامل، بما في ذلك الاتجاه من اليمين إلى اليسار.",
    f2t: "إجابة خلال ثوانٍ", f2p: "مواعيد العمل، والقائمة، والأسعار، ومناطق التوصيل، وطلبات الكعك الخاصة – تلقائيًا.",
    f3t: "تحويل إلى موظف", f3p: "عندما يحتاج السؤال إلى موظف، يجمع المساعد التفاصيل ويرسلها إلى الفريق.",
    footer: "© مخبز نور (وهمي) · الشارقة، الإمارات · موقع تجريبي لعرض مساعد دردشة ثنائي اللغة.",
    botName: "مساعد نور", online: "متصل · يرد فورًا", placeholder: "اكتب سؤالك…", send: "إرسال",
    powered: "روبوت دردشة تجريبي · إجابات مُعدّة مسبقًا ولا يتم حفظ أي بيانات شخصية",
    welcome: "أهلًا وسهلًا! 👋 أنا مساعد مخبز نور. كيف أقدر أساعدك اليوم؟\nيمكنك الكتابة بالإنجليزية أيضًا.",
    quick: ["مواعيد العمل","القائمة والأسعار","التوصيل","طلب كعكة","الموقع"],
    fallback: "عذرًا، لست متأكدًا من ذلك بعد. 🙏 أستطيع مساعدتك في مواعيد العمل، والقائمة، والأسعار، والتوصيل، وطلبات الكعك، والموقع. أو اكتب \"موظف\" لترك رسالة لفريقنا.",
  }
};

// Knowledge base: each intent has keywords (EN + AR) and answers in both languages
const KB = [
  { id:"hours", keys:["hour","open","close","time","timing","when","مواعيد","موعد","ساعات","تفتح","تغلق","الدوام","متى","وقت"],
    en:"🕖 We're open every day:\n• Sat–Thu: 7:00 AM – 11:00 PM\n• Friday: 7:00 AM – 12:00 PM and 2:00 PM – 11:00 PM",
    ar:"🕖 نعمل يوميًا:\n• السبت – الخميس: 7:00 صباحًا – 11:00 مساءً\n• الجمعة: 7:00 صباحًا – 12:00 ظهرًا و2:00 – 11:00 مساءً" },
  { id:"menu", keys:["menu","price","cost","how much","bread","croissant","cake price","sell","قائمة","القائمة","سعر","الأسعار","أسعار","كم","خبز","كرواسون","منيو"],
    en:"🥐 Popular items (example prices):\n• Croissant – AED 6\n• Zaatar manakish – AED 5\n• Cheese fatayer – AED 4\n• Date maamoul (box of 12) – AED 35\n• Chocolate cake (1 kg) – AED 95",
    ar:"🥐 الأصناف الأكثر طلبًا (أسعار تجريبية):\n• كرواسون – 6 دراهم\n• مناقيش زعتر – 5 دراهم\n• فطاير جبن – 4 دراهم\n• معمول بالتمر (علبة 12 قطعة) – 35 درهمًا\n• كيكة شوكولاتة (1 كجم) – 95 درهمًا" },
  { id:"delivery", keys:["deliver","delivery","shipping","dubai","ajman","sharjah area","home","توصيل","التوصيل","دبي","عجمان","توصلون","توصل","المنزل"],
    en:"🚚 We deliver across Sharjah, Ajman and Dubai (Al Qusais, Al Nahda, Deira).\n• Free delivery on orders above AED 75\n• Otherwise AED 10\n• Usual time: 45–60 minutes",
    ar:"🚚 نوصّل إلى جميع مناطق الشارقة وعجمان ودبي (القصيص، النهدة، ديرة).\n• التوصيل مجاني للطلبات فوق 75 درهمًا\n• وإلا 10 دراهم\n• المدة المعتادة: 45 – 60 دقيقة" },
  { id:"cake", keys:["cake","birthday","custom","order","wedding","كعكة","كيكة","كيك","تورتة","عيد ميلاد","طلب","اطلب","زفاف"],
    en:"🎂 Happy to help with a custom cake! Please tell me:\n1. The date you need it\n2. Size (1 kg, 2 kg or 3 kg)\n3. Flavour and any text to write on it\nWe need at least 48 hours' notice.",
    ar:"🎂 يسعدنا تجهيز كعكتك الخاصة! أرسل لي من فضلك:\n1. التاريخ المطلوب\n2. الحجم (1 أو 2 أو 3 كجم)\n3. النكهة وأي عبارة تُكتب عليها\nنحتاج إلى إشعار قبل 48 ساعة على الأقل.",
    follow:"cakeDetails" },
  { id:"location", keys:["where","location","address","map","branch","find you","وين","أين","موقع","الموقع","العنوان","فرع","خريطة"],
    en:"📍 Noor Bakery (fictional), Al Majaz 2, near the Corniche, Sharjah.\nFree parking in front of the shop.",
    ar:"📍 مخبز نور (وهمي)، المجاز 2، بالقرب من الكورنيش، الشارقة.\nمواقف مجانية أمام المحل." },
  { id:"payment", keys:["pay","payment","card","cash","apple pay","دفع","الدفع","بطاقة","كاش","نقدا","نقدًا"],
    en:"💳 We accept cash, all major cards and Apple Pay – in the shop and on delivery.",
    ar:"💳 نقبل الدفع نقدًا وبجميع البطاقات وApple Pay – في المحل وعند التوصيل." },
  { id:"diet", keys:["vegan","gluten","sugar free","halal","allerg","nut","نباتي","جلوتين","غلوتين","بدون سكر","حلال","حساسية","مكسرات"],
    en:"🌿 All our products are halal. We bake gluten-free bread and sugar-free cakes every morning – ask for the 'Light' range. Some items contain nuts.",
    ar:"🌿 جميع منتجاتنا حلال. نخبز يوميًا خبزًا خاليًا من الجلوتين وكعكًا بدون سكر – اسأل عن تشكيلة \"لايت\". بعض الأصناف تحتوي على مكسرات." },
  { id:"staff", keys:["staff","human","agent","person","manager","complain","موظف","انسان","إنسان","شخص","مدير","شكوى"],
    en:"👤 Sure! Please type your name and your question, and our team will reply within 1 hour (during opening hours).",
    ar:"👤 بكل سرور! اكتب اسمك وسؤالك، وسيرد عليك فريقنا خلال ساعة (أثناء أوقات العمل).",
    follow:"staffMsg" },
  { id:"thanks", keys:["thank","thanks","great","perfect","ok thanks","شكرا","شكرًا","مشكور","تسلم","ممتاز","يعطيك العافية"],
    en:"You're welcome! 😊 Anything else I can help with?",
    ar:"العفو! 😊 هل هناك شيء آخر أقدر أساعدك فيه؟" },
  { id:"greet", keys:["hi","hello","hey","salam","good morning","good evening","مرحبا","مرحباً","السلام","سلام","هلا","أهلا","اهلا","صباح","مساء"],
    en:"Hello! 👋 What would you like to know – opening hours, menu, delivery or a cake order?",
    ar:"وعليكم السلام ومرحبًا! 👋 ماذا تريد أن تعرف – مواعيد العمل، القائمة، التوصيل أم طلب كعكة؟" },
];

const FOLLOW = {
  cakeDetails: { en:"✅ Thank you! I've noted your cake request. In a real setup, this would be sent to the bakery's WhatsApp or email, and a staff member would confirm the price.",
                 ar:"✅ شكرًا لك! تم تسجيل طلب الكعكة. في النسخة الحقيقية يُرسَل الطلب إلى واتساب المخبز أو بريده الإلكتروني، ويؤكد أحد الموظفين السعر." },
  staffMsg:    { en:"✅ Message received. In a real setup, this would go straight to the team's inbox. (Demo – nothing is stored.)",
                 ar:"✅ تم استلام رسالتك. في النسخة الحقيقية تُرسَل مباشرة إلى بريد الفريق. (نسخة تجريبية – لا يتم حفظ أي شيء.)" },
};

let lang = "en", pending = null, started = false;
const $ = s => document.querySelector(s);
const msgs = $("#msgs"), quick = $("#quick"), chat = $("#chat"), input = $("#input");

function applyLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T[l][e.dataset.i18n]);
  document.querySelectorAll("[data-i18n-html]").forEach(e => e.innerHTML = T[l][e.dataset.i18nHtml]);
  document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = T[l][e.dataset.i18nPh]);
  $("#langBtn").textContent = l === "ar" ? "English" : "العربية";
  renderQuick();
}
function renderQuick(){
  quick.innerHTML = "";
  T[lang].quick.forEach(q => { const b = document.createElement("button"); b.type="button"; b.textContent=q; b.onclick=()=>send(q); quick.appendChild(b); });
}
function add(text, who){
  const d = document.createElement("div"); d.className = "msg " + who; d.textContent = text;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
}
function botSay(text){
  const t = document.createElement("div"); t.className = "msg bot"; t.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  msgs.appendChild(t); msgs.scrollTop = msgs.scrollHeight;
  setTimeout(() => { t.remove(); add(text, "bot"); }, 500 + Math.min(text.length * 6, 900));
}
const isArabic = s => /[؀-ۿ]/.test(s);
function norm(s){ return s.toLowerCase().replace(/[إأآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي"); }
function findIntent(text){
  const n = norm(text); let best = null, score = 0;
  for (const it of KB){
    let s = 0;
    for (const k of it.keys){
      const nk = norm(k);
      const hit = (/^[a-z ]{1,4}$/.test(nk)) ? new RegExp("\\b" + nk + "\\b").test(n) : n.includes(nk);
      if (hit) s += k.length;
    }
    if (s > score){ score = s; best = it; }
  }
  return best;
}
function send(text){
  text = text.trim(); if (!text) return;
  add(text, "user");
  const ar = isArabic(text);
  if (ar && lang !== "ar") applyLang("ar");
  if (!ar && /[a-z]/i.test(text) && lang !== "en") applyLang("en");
  if (pending){ const f = FOLLOW[pending]; pending = null; return botSay(f[lang]); }
  const it = findIntent(text);
  if (!it) return botSay(T[lang].fallback);
  if (it.follow) pending = it.follow;
  botSay(it[lang]);
}
function openChat(){
  chat.classList.add("open");
  if (!started){ started = true; botSay(T[lang].welcome); }
  setTimeout(() => input.focus(), 50);
}
$("#toggle").onclick = () => chat.classList.contains("open") ? chat.classList.remove("open") : openChat();
$("#close").onclick = () => chat.classList.remove("open");
$("#heroChat").onclick = openChat;
$("#langBtn").onclick = () => applyLang(lang === "en" ? "ar" : "en");
$("#form").onsubmit = e => { e.preventDefault(); send(input.value); input.value = ""; };
applyLang("en");
</script>
</body>
</html>
